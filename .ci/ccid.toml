schema = 1
project = "cgreet"

# Select affected checks explicitly; no implicit full language/platform matrix.
[checks.rust]
kind = "cargo"
actions = ["fmt", "test", "clippy"]

[checks.fmt]
kind = "cargo"
actions = ["fmt"]

[checks.metadata]
kind = "commands"
commands = [["python3", ".ci/check.py", "metadata"]]

[checks.javascript]
kind = "commands"
commands = [["python3", ".ci/check.py", "javascript"]]

[checks.rust-package]
kind = "commands"
commands = [["python3", ".ci/check.py", "rust-package"]]

[checks.rust-dependencies]
kind = "commands"
commands = [["python3", ".ci/check.py", "rust-dependencies"]]

[checks.js-package]
kind = "commands"
commands = [["python3", ".ci/check.py", "js-package"]]

[checks.js-pnpm]
kind = "commands"
commands = [["python3", ".ci/check.py", "js-pnpm"]]

[checks.js-yarn]
kind = "commands"
commands = [["python3", ".ci/check.py", "js-yarn"]]

[checks.js-bun]
kind = "commands"
commands = [["python3", ".ci/check.py", "js-bun"]]

[checks.python-package]
kind = "commands"
commands = [["python3", ".ci/check.py", "python-package"]]

[checks.typst-package]
kind = "commands"
commands = [["python3", ".ci/check.py", "typst-package"]]

[checks.typst-preview]
kind = "commands"
commands = [["python3", ".ci/check.py", "typst-preview"]]

[checks.published-npm]
kind = "commands"
commands = [["python3", ".ci/check.py", "published-npm"]]

[checks.published-python]
kind = "commands"
commands = [["python3", ".ci/check.py", "published-python"]]

# verify aggregates the cached checks of the verify job in dependency order: rust and the
# standalone packaging/integration selectors of .ci/check.py. The registry/live-read
# selectors (published-npm/python) run FRESH after the cached verify via `ccid check`
# (never `cached`). The artifact-manifest selectors (rust-dependencies, typst-preview,
# registry-resolved previews) stay defined and callable by hand; they are not in the job.
# The packages of a release are made by `pack` (below), once, in the release run.
# No cache_inputs (broad default); no cache_outputs (packaging receipts land in ARTIFACT_ROOT,
# outside the repo tree); no cache_env (no shells; dynamic paths must not key the cache).
# No deny.toml ships, so there is no advisories check; freshness is carried by the
# per-selector fresh checks above instead.

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["python3", "--version"], ["node", "--version"], ["bun", "--version"], ["npm", "--version"], ["deno", "--version"], ["uv", "--version"]]

# The packages of a release (operating model R23, R8): crate, npm tarball and PyPI files, made once by the
# release run before anything is public. A pack is never a check of a job. JSR is not published for now (R46).
[checks.pack]
kind = "pack"
crates = "."
npm = "js/@corbet-labs/cgreet"
pypi = "py"

[release]
kind = "library"
version = "Cargo.toml"
registries = ["crates", "npm", "pypi"]
build = ["pack"]
notes = "CHANGELOG.md"

[render]
render_schema = 3
[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["verify", "published-npm", "published-python"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
